name: Build AthenaBot Template Zips

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FULL TEMPLATE (everything)
      - name: Create full template zip
        run: |
          zip -r AthenaBot-template-full.zip . \
            -x ".git/*" ".github/*" "*.zip"

      # NO DASHBOARD TEMPLATE
      - name: Create no-dashboard template zip
        run: |
          zip -r AthenaBot-template-no-dashboard.zip . \
            -x ".git/*" ".github/*" "*.zip" \
               "data/dashboard/*" \
               "src/dashboard/*"

      # MINIMAL TEMPLATE (no dashboard + routes + handler)
      - name: Create minimal template zip
        run: |
          zip -r AthenaBot-template-minimal.zip . \
            -x ".git/*" ".github/*" "*.zip" \
               "data/dashboard/*" \
               "src/dashboard/*" \
               "src/routes/*" \
               "src/handler/*"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            AthenaBot-template-full.zip
            AthenaBot-template-no-dashboard.zip
            AthenaBot-template-minimal.zip
