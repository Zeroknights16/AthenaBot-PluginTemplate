name: Build AthenaBot Template Zips

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1️⃣ FULL TEMPLATE
      - name: Create full template zip
        run: zip -r AthenaBot-template-full.zip . \
          -x ".git/*" ".github/*"

      # 2️⃣ NO DASHBOARD TEMPLATE
      - name: Create no-dashboard template zip
        run: zip -r AthenaBot-template-no-dashboard.zip . \
          -x ".git/*" ".github/*" \
             "data/dashboard/*" \
             "src/dashboard/*"

      # 3️⃣ MINIMAL TEMPLATE (no dashboard + routes + handler)
      - name: Create minimal template zip
        run: zip -r AthenaBot-template-minimal.zip . \
          -x ".git/*" ".github/*" \
             "data/dashboard/*" \
             "src/dashboard/*" \
             "src/routes/*" \
             "src/handler/*"

      # Upload to release
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AthenaBot-template-full.zip
            AthenaBot-template-no-dashboard.zip
            AthenaBot-template-minimal.zip
