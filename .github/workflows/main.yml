name: Build AthenaBot Template Zips

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Templates
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mkdir dist

          RSYNC_BASE="rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='dist' --exclude='build_full' --exclude='build_no_dash' --exclude='build_minimal'"

          eval "$RSYNC_BASE . build_full/"
          cd build_full && zip -r "../dist/AthenaBot-PluginTemplate-${VERSION}.zip" . && cd ..

          eval "$RSYNC_BASE . build_no_dash/"
          rm -rf build_no_dash/data/dashboard build_no_dash/src/dashboard
          cd build_no_dash && zip -r "../dist/AthenaBot-PluginTemplate-no-dashboard-${VERSION}.zip" . && cd ..

          eval "$RSYNC_BASE . build_minimal/"
          rm -rf build_minimal/data/dashboard build_minimal/src/dashboard \
                 build_minimal/src/routes build_minimal/src/handler
          cd build_minimal && zip -r "../dist/AthenaBot-PluginTemplate-minimal-${VERSION}.zip" . && cd ..

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip
